version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifepilot-postgres
    restart: always
    environment:
      POSTGRES_USER: lifepilot
      POSTGRES_PASSWORD: lifepilot_password
      POSTGRES_DB: lifepilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
